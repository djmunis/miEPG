name: miEPG

on:
  schedule:
    - cron: '56 * * * *' # Ejecutar a las 13:30 AM (ten en cuenta el horario verano/invierno)
      timezone: 'Europe/Madrid'
  workflow_dispatch:
permissions:
   contents: write
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v2

    - name: Comprobar e Instalar xmllint
      run: |
        sudo apt-get update && sudo apt-get install -y libxml2-utils

    - name: Dar permisos de ejecución al script
      run: |
        chmod +x .github/workflows/EPG_script.sh

    - name: Ejecutar script
      run: .github/workflows/EPG_script.sh

    - name: Configurar identidad de Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@
        
    - name: Subir archivos
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        if git diff --cached --quiet; then
          echo "El EPG no ha cambiado. No hay nada que publicar."
        else
          git commit -m "Nuevo miEPG.xml"
          git push
        fi

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
